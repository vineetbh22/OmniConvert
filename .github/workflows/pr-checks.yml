name: PR Validation

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Formatting
        run: black --check .

      # - name: Type Checking
      #   run: mypy omni

      # - name: Tests
      #   run: pytest --cov=omni

      - name: Security
        run: bandit -r omni

      - name: Dependency Audit
        run: pip-audit
